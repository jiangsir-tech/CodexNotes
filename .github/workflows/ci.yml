name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify localizations
        run: zsh scripts/verify-localizations.sh

      - name: Run tests
        run: COPYFILE_DISABLE=1 swift test
